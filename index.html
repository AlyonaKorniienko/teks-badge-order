<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>ТЕКС Україна — замовлення посвідчення</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="bar"><div class="mark">ТЕКС <b>УКРАЇНА</b></div><small>Відділ кадрів</small></div></header>
<main>
  <h1>Замовлення посвідчення</h1>
  <p class="lead">Заповніть дані нового співробітника й додайте фото — бейдж буде підготовлено автоматично.</p>

  <div class="card" id="formCard">
    <form id="f" autocomplete="off">
      <div class="grid">
        <div><label for="firstName">Імʼя</label><input id="firstName" maxlength="60" required></div>
        <div><label for="lastName">Прізвище</label><input id="lastName" maxlength="60" required></div>
        <div><label for="city">Регіональний підрозділ</label>
          <input id="city" list="cities" maxlength="60" placeholder="Почніть вводити місто" required><datalist id="cities"></datalist></div>
        <div><label for="position">Посада</label>
          <input id="position" list="positions" maxlength="60" value="Водій-курʼєр" required>
          <datalist id="positions"><option>Водій-курʼєр</option><option>Курʼєр</option><option>Оператор</option><option>Оператор відділення</option><option>Нічний оператор-вантажник</option></datalist></div>
        <div><label for="code">Код з бази 1С</label><input id="code" inputmode="numeric" maxlength="9" placeholder="000001234" required>
          <div class="hint">До 9 цифр. Ведучі нулі додадуться самі.</div></div>
        <div><label for="passcode">Код доступу</label><input id="passcode" type="password" autocomplete="current-password" required>
          <div class="hint">Видає відділ маркетингу.</div></div>
        <div class="full"><label>Фото співробітника</label>
          <label class="photo" for="photo">
            <div class="ph" id="ph">📷</div><img id="prev" alt="">
            <div><b id="photoName">Натисніть, щоб обрати фото</b><span>Портрет, обличчя добре видно, JPG або PNG</span></div>
          </label>
          <input id="photo" type="file" accept="image/*" class="hidden">
        </div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="actions"><button type="submit" id="go">Надіслати замовлення</button></div>
    </form>
  </div>

  <div class="card done" id="done">
    <div class="tick">✓</div>
    <h2 id="doneTitle">Замовлення прийнято</h2>
    <p class="lead" id="doneText"></p>
    <div class="actions center"><button id="again">Додати ще одного співробітника</button></div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
